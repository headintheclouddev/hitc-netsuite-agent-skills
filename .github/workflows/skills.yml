name: Skills

# Pull requests and pushes to main: validate every skill.
# Version tags (e.g. v0.1.0): validate, build one zip per skill, and publish a GitHub release with the zips attached.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skills
        run: python3 scripts/build_skills.py --check

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create the release and upload the zips
    steps:
      - uses: actions/checkout@v4
      - name: Validate and build zips
        run: python3 scripts/build_skills.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Zip names carry no version number, so ".../releases/latest/download/<skill>.zip" always works.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
          fi
